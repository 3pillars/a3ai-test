<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vegas Gold Slots</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd700;--pink:#ff1493;--green:#0f0;--bg:#0a0a0a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Orbitron,sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
h1{color:var(--gold);text-shadow:0 0 20px var(--gold);font-size:1.8rem;margin-bottom:15px}
.info{display:flex;gap:15px;margin-bottom:15px}
.info-box{background:#1a1a1a;border:2px solid #333;border-radius:8px;padding:10px 15px;text-align:center;min-width:80px}
.info-box label{display:block;font-size:0.6rem;color:#888;margin-bottom:4px}
.info-box .val{font-size:1.1rem;font-weight:700}
.info-box.bal .val{color:var(--green)}
.slots{background:#111;border:4px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:15px;width:100%;max-width:320px}
.screen{background:#000;border-radius:8px;padding:8px;position:relative}
.reels{display:flex;gap:6px;justify-content:center}
.reel{width:80px;height:120px;background:#1a1a1a;border-radius:4px;overflow:hidden;position:relative}
.reel::after{content:'';position:absolute;bottom:0;left:0;right:0;height:20px;background:linear-gradient(transparent,#000)}
.reel::before{content:'';position:absolute;top:0;left:0;right:0;height:20px;background:linear-gradient(#000,transparent)}
.syms{display:flex;flex-direction:column;transition:transform 0.05s}
.sym{height:40px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:#1a1a1a}
.sym.win{background:var(--gold);animation:pulse 0.3s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.winmsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:var(--gold);padding:15px 25px;border-radius:8px;font-size:1.2rem;border:2px solid var(--gold);z-index:10;display:none}
.winmsg.show{display:block;animation:pop 0.5s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}50%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1)}}
.controls{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.bet-row{display:flex;justify-content:center;align-items:center;gap:15px}
.bet-btn{width:45px;height:45px;border-radius:50%;border:2px solid var(--gold);background:#222;color:var(--gold);font-size:1.5rem;font-weight:700;cursor:pointer}
.bet-btn:active{transform:scale(0.95);background:var(--gold);color:#000}
.bet-amt{font-size:1.2rem;min-width:80px;text-align:center}
.spin-btn{width:100%;height:60px;border-radius:30px;border:3px solid var(--gold);background:linear-gradient(var(--pink),#c00);color:#fff;font-size:1.3rem;font-weight:700;font-family:Orbitron;cursor:pointer;letter-spacing:2px}
.spin-btn:active{transform:scale(0.98)}
.spin-btn:disabled{background:#444;border-color:#444;cursor:not-allowed}
.sound-btn{position:fixed;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:#000;color:var(--gold)}
.paytable-btn{position:fixed;top:10px;left:10px;background:#000;border:2px solid #333;color:#888;padding:8px;border-radius:5px;font-size:0.8rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal h2{color:var(--gold);margin-bottom:20px}
.pt-row{display:flex;justify-content:space-between;width:250px;padding:8px;border-bottom:1px solid #333}
.modal button{margin-top:20px;padding:10px 30px;background:var(--pink);color:#fff;border:none;border-radius:20px;font-size:1rem}
</style>
</head>
<body>
<button class="paytable-btn" onclick="showPT()">PAYOUTS</button>
<button class="sound-btn" id="sndBtn" onclick="toggleSnd()">🔊</button>

<h1>🎰 VEGAS GOLD 🎰</h1>

<div class="info">
<div class="info-box bal"><label>BALANCE</label><div class="val" id="bal">$1000</div></div>
<div class="info-box"><label>BET</label><div class="val" id="bet">$0.90</div></div>
<div class="info-box"><label>WIN</label><div class="val" id="win">$0</div></div>
</div>

<div class="slots">
<div class="screen">
<div class="reels">
<div class="reel"><div class="syms" id="r0"></div></div>
<div class="reel"><div class="syms" id="r1"></div></div>
<div class="reel"><div class="syms" id="r2"></div></div>
</div>
<div class="winmsg" id="winmsg">WIN $0!</div>
</div>
</div>

<div class="controls">
<div class="bet-row">
<button class="bet-btn" id="betDown" onclick="adjBet(-1)">−</button>
<div class="bet-amt" id="betAmt">$0.90</div>
<button class="bet-btn" id="betUp" onclick="adjBet(1)">+</button>
</div>
<button class="spin-btn" id="spinBtn" onclick="doSpin()">SPIN</button>
</div>

<div class="modal" id="paytable">
<h2>🎰 PAYOUTS</h2>
<div class="pt-row"><span>5 🎰</span><span style="color:var(--gold)">500x</span></div>
<div class="pt-row"><span>4 🎰</span><span>50x</span></div>
<div class="pt-row"><span>3 🎰</span><span>10x</span></div>
<div class="pt-row"><span>5 💎</span><span>250x</span></div>
<div class="pt-row"><span>4 💎</span><span>25x</span></div>
<div class="pt-row"><span>3 💎</span><span>5x</span></div>
<div class="pt-row"><span>5 🔔</span><span>100x</span></div>
<div class="pt-row"><span>4 🔔</span><span>20x</span></div>
<div class="pt-row"><span>3 🔔</span><span>4x</span></div>
<div class="pt-row"><span>3 🎁</span><span style="color:var(--pink)">FREE SPINS</span></div>
<button onclick="showPT()">CLOSE</button>
</div>

<script>
var SYMS = ['🎰','💎','🔔','7️⃣','🍒','🍋','🍇','🎁'];
var PAY = {'🎰':{5:500,4:50,3:10},'💎':{5:250,4:25,3:5},'🔔':{5:100,4:20,3:4},'7️⃣':{5:75,4:15,3:3},'🍒':{5:50,4:10,3:2},'🍋':{5:25,4:5,3:1},'🍇':{5:15,3:1}};
var BETS = [0.09,0.45,0.90,1.80,4.50,9.00];

var bal = 1000, bet = 2, spin = false, snd = true, free = 0, lastWin = 0, ctx = null;

function init() {
    console.log('Init...');
    render();
    update();
    document.body.onclick = initAudio;
}

function initAudio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    document.body.onclick = null;
}

function play(f, d, v) {
    if (!ctx || !snd) return;
    try {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f;
        g.gain.setValueAtTime(v || 0.1, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + d);
    } catch(e) { console.log('Audio:', e); }
}

function sClick() { play(600, 0.02, 0.1); play(900, 0.01, 0.05); }
function sReel() { play(100 + Math.random()*50, 0.02, 0.05); }
function sStop() { play(60, 0.05, 0.15); }
function sWin() { [523,659,784,1047].forEach(function(f,i){setTimeout(function(){play(f,0.08,0.15)},i*60)}); }
function sBig() { [392,523,659,784,1047].forEach(function(f,i){setTimeout(function(){play(f,0.1,0.2)},i*80)}); }
function sJack() { [262,330,392,523,659,784,1047,1319,1568].forEach(function(f,i){setTimeout(function(){play(f,0.1,0.25)},i*50)}); }
function sBonus() { [400,600,800,1000].forEach(function(f,i){setTimeout(function(){play(f,0.05,0.2)},i*40)}); }

function toggleSnd() { snd = !snd; document.getElementById('sndBtn').textContent = snd?'🔊':'🔇'; }

function rand() { return SYMS[Math.floor(Math.random() * (SYMS.length - 1))]; }

function render() {
    for (var r = 0; r < 3; r++) {
        var el = document.getElementById('r' + r);
        var html = '<div class="syms">';
        for (var i = 0; i < 10; i++) html += '<div class="sym">' + rand() + '</div>';
        el.innerHTML = html + '</div>';
    }
}

function update() {
    document.getElementById('bal').textContent = '$' + bal;
    document.getElementById('bet').textContent = '$' + BETS[bet];
    document.getElementById('betAmt').textContent = '$' + BETS[bet].toFixed(2);
    document.getElementById('win').textContent = '$' + lastWin;
    var btn = document.getElementById('spinBtn');
    if (free > 0) {
        btn.textContent = 'FREE(' + free + ')';
        btn.style.background = 'linear-gradient(#0a0,#080)';
    } else {
        btn.textContent = 'SPIN';
        btn.style.background = '';
    }
}

function adjBet(d) {
    initAudio();
    sClick();
    bet = Math.max(0, Math.min(BETS.length - 1, bet + d));
    update();
}

function showPT() { document.getElementById('paytable').classList.toggle('show'); }

function doSpin() {
    if (spin) return;
    initAudio();
    
    var betAmt = BETS[bet];
    
    if (free > 0) {
        free--;
        sWin();
    } else {
        if (bal < betAmt) { alert('Insufficient balance!'); return; }
        sClick();
        bal -= betAmt;
    }
    
    spin = true;
    document.getElementById('spinBtn').disabled = true;
    document.querySelectorAll('.sym').forEach(function(s){s.classList.remove('win')});
    
    var res = [];
    for (var r = 0; r < 3; r++) {
        setTimeout((function(ri){return function(){spinReel(ri, res)}}(r)), r * 200);
    }
    
    setTimeout(function(){checkWin(res)}, 3 * 200 + 300);
}

function spinReel(r, res) {
    var el = document.getElementById('r' + r);
    var syms = el.querySelector('.syms');
    var t = 0;
    var int = setInterval(function(){
        sReel();
        syms.style.transform = 'translateY(-' + (Math.random() * 40) + 'px)';
        t += 20;
        if (t > 350 + r * 50) {
            clearInterval(int);
            var s = rand();
            res[r] = s;
            syms.innerHTML = '<div class="sym">' + rand() + '</div><div class="sym">' + rand() + '</div><div class="sym" style="background:#222">' + s + '</div><div class="sym">' + rand() + '</div>';
            syms.style.transform = 'translateY(-40px)';
            sStop();
        }
    }, 20);
}

function checkWin(res) {
    if (res.length < 3) return;
    
    var betAmt = BETS[bet];
    var winAmt = 0;
    
    // Scatter
    var scat = res.filter(function(r){return r === '🎁'}).length;
    if (scat >= 3) {
        free += scat * 5;
        sBonus();
    }
    
    // All 3 same
    if (res[0] === res[1] && res[1] === res[2]) {
        var s = res[0];
        if (PAY[s] && PAY[s][5]) {
            winAmt = PAY[s][5] * betAmt;
            for (var r = 0; r < 3; r++) {
                var el = document.getElementById('r' + r);
                el.querySelectorAll('.sym')[2].classList.add('win');
            }
        }
    }
    // 2 same
    else if (res[0] === res[1] || res[1] === res[2]) {
        var s = res[1];
        if (PAY[s] && PAY[s][3]) {
            winAmt = PAY[s][3] * betAmt;
            document.getElementById('r1').querySelectorAll('.sym')[2].classList.add('win');
        }
    }
    
    if (winAmt > 0) {
        if (free === 0) bal += winAmt;
        lastWin = winAmt;
        update();
        
        if (winAmt >= betAmt * 20) {
            sJack();
            showWin('💎 JACKPOT! $' + winAmt.toFixed(2));
        } else if (winAmt >= betAmt * 5) {
            sBig();
            showWin('WIN $' + winAmt.toFixed(2));
        } else {
            sWin();
            showWin('+$' + winAmt.toFixed(2));
        }
    }
    
    spin = false;
    document.getElementById('spinBtn').disabled = false;
    update();
}

function showWin(msg) {
    var el = document.getElementById('winmsg');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function(){el.classList.remove('show')}, 2000);
}

init();
</script>
</body>
</html>
